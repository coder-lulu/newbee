name: Ops-Center Generate + Build

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'ops-center/**'
      - 'scripts/ops-center-generate-and-build.sh'
      - '.github/workflows/ops-center-generate-build.yml'

jobs:
  gen_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Cache Go Build
        uses: actions/cache@v4
        with:
          path: |
            ops-center/rpc/.gocache
            ops-center/api/.gocache
          key: ${{ runner.os }}-opscenter-${{ hashFiles('**/go.mod') }}
      - name: Install protoc (if needed)
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler || true
      - name: Generate + Build
        env:
          GOCTLS_BIN: goctls
        run: |
          chmod +x scripts/ops-center-generate-and-build.sh
          ./scripts/ops-center-generate-and-build.sh

